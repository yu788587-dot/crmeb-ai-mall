; +----------------------------------------------------------------------
; | crmeb-ai-mall 开发/演示环境 PHP 调优（覆盖镜像默认配置）
; +----------------------------------------------------------------------
; | 背景：在 Windows + Docker Desktop（WSL2）下，源码通过 9p 协议挂载进容器，
; | 每一次文件元数据操作（stat/realpath）都是一次跨系统 RPC。
; | 镜像默认的 open_basedir 会让 PHP 对每个 include 的文件做一次 realpath 校验，
; | 实测把后台单个接口耗时从 3s 放大到 60s+ 直接超时。
; | 本文件按字母序在 99-overrides.ini 之后解析，用于清空 open_basedir 并开启 OPcache。
; | 仅用于本地开发 / 演示；生产部署建议把代码放进镜像或命名卷后恢复 open_basedir。
; +----------------------------------------------------------------------

; 清空上游 99-overrides.ini 中的 open_basedir（9p 挂载下 realpath 校验代价极高）
open_basedir =

; ---- OPcache：编译结果常驻 shm，关闭运行时时间戳校验，改代码后用 sync.sh 自动 reload ----
zend_extension = opcache.so
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

; ---- 路径解析缓存 ----
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; ---- 时区 / 上传（与上游保持一致，避免被解析顺序覆盖时丢参数）----
date.timezone = Asia/Shanghai
upload_max_filesize = 100M
post_max_size = 108M
upload_tmp_dir = /var/www/temp
max_execution_time = 300
