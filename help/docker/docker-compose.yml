services:
  # mysql 容器
  mysql:
    container_name: crmeb_mysql
    image: ccr.ccs.tencentyun.com/crmebky_php/mysql:v8.0.45
    ports:
      - "33061:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: crmeb
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: crmeb
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/log:/var/log/mysql
    networks:
      app_net:
        ipv4_address: 192.168.10.11
  # redis 容器
  redis:
    container_name: crmeb_redis
    image: ccr.ccs.tencentyun.com/crmebky_php/redis:v8.6.1
    ports:
      - "63791:6379"
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: 123456
    networks:
      app_net:
        ipv4_address: 192.168.10.10
  # php 容器
  phpfpm:
    container_name: crmeb_php
    image: ccr.ccs.tencentyun.com/crmebky_php/php:v7.4
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST_IP: crmeb_mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: crmeb
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: crmeb
      REDIS_HOST_IP: crmeb_redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: 123456
      APP_DEBUG: true
      DEFAULT_TIMEZONE: Asia/Shanghai
    ports:
      - "9000:9000"
      - "40001:40001"
      - "40002:40002"
    working_dir: /var/www
    volumes:
      # 【二开改动 · Windows/Docker Desktop 性能优化】
      # 上游把源码 ../../crmeb 直接绑定挂载到 /var/www。在 Windows + WSL2 后端下这是 9p 挂载，
      # 单次文件元数据操作约 200ms，一次框架请求要 stat 上千个文件，后台接口实测 60s+ 直接 504。
      # 这里改为 WSL2 ext4 命名卷，代码由 help/docker/sync.sh 以 tar 流同步进容器（NTFS 读取很快），
      # 同时挂入 php/conf.d/zz-dev.ini 关闭 9p 下代价极高的 open_basedir realpath 校验并开启 OPcache。
      - crmeb_app:/var/www
      - ./php/conf.d/zz-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    networks:
      app_net:
        ipv4_address: 192.168.10.90
  # nginx 容器
  nginx:
    container_name: crmeb_nginx
    image: ccr.ccs.tencentyun.com/crmebky_php/nginx:v1.29.6
    restart: always
    ports:
      - "8011:80"
    depends_on:
      - phpfpm
    environment:
      TZ: Asia/Shanghai
    working_dir: /var/www
    volumes_from:
      - phpfpm
    volumes:
      - ./nginx/vhost.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/log:/etc/nginx/log
    networks:
      app_net:
        ipv4_address: 192.168.10.80
networks:
  app_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.10.0/24

volumes:
  # 应用代码卷：位于 Docker Desktop 的 WSL2 VM（ext4），避免 Windows 9p 挂载性能悬崖。
  # 首次使用请执行 bash help/docker/sync.sh 将 ../../crmeb 同步进来。
  crmeb_app: